<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery - Premier Rays</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/logo.png">
  <style>
    /* ===== Gallery Page Custom Styles ===== */

    .filter-bar {
      text-align: center;
      margin: 20px 0;
    }
    .filter-btn {
      background: #0066cc;
      color: #fff;
      border: none;
      padding: 10px 18px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .filter-btn:hover,
    .filter-btn.active {
      background: #004c99;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .gallery-grid img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .gallery-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }

    /* Lightbox viewer */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 999;
    }
    .lightbox.active {
      visibility: visible;
      opacity: 1;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
    .lightbox span {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 32px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <h1>Premier Rays Gallery</h1>
    <p>Explore our Tourism, Sports & Travels Highlights</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="tourism.html">Tourism</a>
    <a href="sports.html">Sports</a>
    <a href="travels.html">Tours & Travels</a>
    <a href="gallery.html" class="active">Gallery</a>
  </nav>

  <main class="container">
    <h2 style="text-align:center;">Gallery</h2>
    <p style="text-align:center;">Browse our experiences by category and subcategory.</p>

    <!-- Main Category Buttons -->
    <div class="filter-bar" id="mainFilters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="tourism">Tourism</button>
      <button class="filter-btn" data-category="sports">Sports</button>
      <button class="filter-btn" data-category="travels">Travels</button>
    </div>

    <!-- Subcategory Buttons -->
    <div class="filter-bar" id="subFilters"></div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="gallery">
      <p>Loading images...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Premier Rays Pvt Ltd. All Rights Reserved.</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span id="closeLightbox">&times;</span>
    <img src="" alt="">
  </div>

  <script>
    const galleryContainer = document.getElementById("gallery");
    const mainFilters = document.getElementById("mainFilters");
    const subFilters = document.getElementById("subFilters");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");
    const closeLightbox = document.getElementById("closeLightbox");

    const subCategories = {
      tourism: ["ecostay", "nature-treks", "coffee-estate"],
      sports: ["courts", "training", "accessories"],
      travels: ["innova", "urbania"]
    };

    let allImages = [];
    let currentMain = "all";
    let currentSub = null;

    // Load JSON images list
    fetch("images.json")
      .then(res => res.json())
      .then(images => {
        allImages = images;
        renderGallery();
      })
      .catch(() => {
        galleryContainer.innerHTML = "<p style='color:red;'>Unable to load images.</p>";
      });

    // Handle main category clicks
    mainFilters.addEventListener("click", (e) => {
      if (e.target.tagName === "BUTTON") {
        document.querySelectorAll("#mainFilters button").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentMain = e.target.dataset.category;
        currentSub = null;
        renderSubFilters();
        renderGallery();
      }
    });

    // Render subcategory buttons dynamically
    function renderSubFilters() {
      subFilters.innerHTML = "";
      if (subCategories[currentMain]) {
        subCategories[currentMain].forEach(sub => {
          const btn = document.createElement("button");
          btn.className = "filter-btn";
          btn.textContent = capitalize(sub.replace("-", " "));
          btn.dataset.sub = sub;
          btn.onclick = () => {
            document.querySelectorAll("#subFilters button").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentSub = sub;
            renderGallery();
          };
          subFilters.appendChild(btn);
        });
      }
    }

    // Render gallery images
    function renderGallery() {
      galleryContainer.innerHTML = "";

      let filtered = [];
      if (currentMain === "all") {
        filtered = allImages;
      } else if (currentSub) {
        filtered = allImages.filter(img => img.category === currentSub);
      } else {
        const validSubs = subCategories[currentMain];
        filtered = allImages.filter(img => validSubs && validSubs.includes(img.category));
      }

      if (filtered.length === 0) {
        galleryContainer.innerHTML = "<p>No images available for this category.</p>";
        return;
      }

      filtered.forEach(img => {
        const imageEl = document.createElement("img");
        imageEl.src = img.url;
        imageEl.alt = img.category;
        imageEl.addEventListener("click", () => openLightbox(img.url));
        galleryContainer.appendChild(imageEl);
      });
    }

    // Lightbox controls
    function openLightbox(src) {
      lightbox.classList.add("active");
      lightboxImg.src = src;
    }
    closeLightbox.onclick = () => lightbox.classList.remove("active");
    lightbox.onclick = (e) => {
      if (e.target === lightbox) lightbox.classList.remove("active");
    };

    // Utility
    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }
  </script>
</body>
</html>
